#-------------------------------------------------------------------------------
# Physics
#-------------------------------------------------------------------------------

Physics.Gravity.Constant       = 0.0001
Physics.Repulsion.Constant     = 4.0
Physics.Softening.Epsilon      = 0.009
Physics.Friction.Coefficient   = 0.99
Physics.Friction.Anisotropic   = 0.99
Physics.Elasticity.Coefficient = 0.9
Physics.User.Acceleration      = 1.0
Physics.Boundary.Collision     = true
Physics.Collision.Iterations   = 4

Physics.Gravity.Enabled        = true
Physics.Repulsion.Enabled      = true
Physics.Friction.Enabled       = true
Physics.Elasticity.Enabled     = true

#-------------------------------------------------------------------------------
# Particle Group Properties
#-------------------------------------------------------------------------------

Particle.Mass.Red    = 8.0
Particle.Mass.Green  = 4.0
Particle.Mass.Blue   = 2.0
Particle.Mass.Yellow = 1.0

Particle.Radius.Red    = 0.032
Particle.Radius.Green  = 0.016
Particle.Radius.Blue   = 0.008
Particle.Radius.Yellow = 0.004


#-------------------------------------------------------------------------------
# Trails
#-------------------------------------------------------------------------------

Trail.Color.Red      = 255,128,128
Trail.Color.Green    = 128,255,128
Trail.Color.Blue     = 128,128,255
Trail.Color.Yellow   = 255,255,128
Trail.Color.Selected = 128,128,128
Trail.Depth          = 1000
Trail.Opacity.Head   = 0.03
Trail.Opacity.Tail   = 0.0
Trail.Thickness      = 4
Trail.Visible        = true

#-------------------------------------------------------------------------------
# Wireframe
#-------------------------------------------------------------------------------

Wireframe.Visible = false

#-------------------------------------------------------------------------------
# Shadow (Simulation Sprites)
#-------------------------------------------------------------------------------

Shadow.Offset.X = 0.0
Shadow.Offset.Y = 0.025
Shadow.Opacity  = 0.4
Shadow.Scale    = 1.4

#-------------------------------------------------------------------------------
# Projection
#-------------------------------------------------------------------------------

Projection.Zoom = 1.0

#-------------------------------------------------------------------------------
# HUD (Heads Up Display)
#-------------------------------------------------------------------------------

Hud.Font.Name   = Courier New
Hud.Font.Size   = 14
Hud.Font.Color  = 0,255,0
Hud.Position.X  = 10.0
Hud.Position.Y  = 10.0

#-------------------------------------------------------------------------------
# Initial Particle Velocity
#-------------------------------------------------------------------------------

Initial.Velocity.Min = 0.02
Initial.Velocity.Max = 0.04
