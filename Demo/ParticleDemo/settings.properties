#-------------------------------------------------------------------------------
# Application
#-------------------------------------------------------------------------------

Application.Name            = Particle Simulator
Application.Version.Major   = 1
Application.Version.Minor   = 2
Application.Screen.Width    = 1920
Application.Screen.Height   = 1080
Application.Logging.Enabled = true

#-------------------------------------------------------------------------------
# Menu Background Images
#-------------------------------------------------------------------------------

Menu.Background.Main         = Demo/ParticleDemo/Resources/Images/Background/background-menu-title-1920x1080.png
Menu.Background.Settings     = Demo/ParticleDemo/Resources/Images/Background/background-menu-title-settings-1920x1080.png
Menu.Background.Instructions = Demo/ParticleDemo/Resources/Images/Background/background-menu-title-instructions-1920x1080.png
Menu.Background.About        = Demo/ParticleDemo/Resources/Images/Background/background-menu-title-about-1920x1080.png

#-------------------------------------------------------------------------------
# Menu Button Images
#-------------------------------------------------------------------------------

Menu.Button.Image.Up           = Demo/ParticleDemo/Resources/Images/Buttons/button-up.png
Menu.Button.Image.UpSelected   = Demo/ParticleDemo/Resources/Images/Buttons/button-up-selected.png
Menu.Button.Image.Down         = Demo/ParticleDemo/Resources/Images/Buttons/button-down.png
Menu.Button.Image.DownSelected = Demo/ParticleDemo/Resources/Images/Buttons/button-down-selected.png
Menu.Button.Image.Disabled     = Demo/ParticleDemo/Resources/Images/Buttons/button-disabled.png
Menu.Button.Image.Shadow       = Demo/ParticleDemo/Resources/Images/Buttons/button-shadow.png
Menu.Button.Shadow.Offset.X    = 6
Menu.Button.Shadow.Offset.Y    = 6
Menu.Button.Shadow.Opacity     = 0.1

#-------------------------------------------------------------------------------
# Menu Button Font
#-------------------------------------------------------------------------------

Menu.Button.Font.Name             = Anita  Semi-square
Menu.Button.Font.Size             = 30
Menu.Button.Font.Color.Selected   = 255,255,255
Menu.Button.Font.Color.Unselected = 128,128,128
Menu.Button.Font.Color.Disabled   = 64,64,64

#-------------------------------------------------------------------------------
# Menu Button Layout
#-------------------------------------------------------------------------------

Menu.Button.Layout.X         = 480
Menu.Button.Layout.Y.Start   = 290
Menu.Button.Layout.Y.Spacing = 140

#-------------------------------------------------------------------------------
# Menu Text Box
#-------------------------------------------------------------------------------

Menu.TextBox.Font.Name    = Courier New
Menu.TextBox.Font.Size    = 18
Menu.TextBox.Font.Color   = 255,255,255
Menu.TextBox.Text.Opacity = 0.5
Menu.TextBox.X            = 200
Menu.TextBox.Y            = 280
Menu.TextBox.Width        = 1520
Menu.TextBox.Height       = 500

#-------------------------------------------------------------------------------
# Menu Text Files
#-------------------------------------------------------------------------------

Menu.Text.Instructions           = Demo/ParticleDemo/Resources/Text/instructions.txt
Menu.Text.Instructions.Alignment = left
Menu.Text.About                  = Demo/ParticleDemo/Resources/Text/about.txt
Menu.Text.About.Alignment        = center

#-------------------------------------------------------------------------------
# Particle Count Defaults
#-------------------------------------------------------------------------------

Particle.Count.Red.Default    = 6
Particle.Count.Green.Default  = 3
Particle.Count.Blue.Default   = 1
Particle.Count.Yellow.Default = 3
Particle.Count.Min            = 0
Particle.Count.Max            = 32

#-------------------------------------------------------------------------------
# Simulation Background
#-------------------------------------------------------------------------------

Simulation.Background = Demo/ParticleDemo/Resources/Images/Background/background-simulator-1920x1080.png

#-------------------------------------------------------------------------------
# Sprite Images
#-------------------------------------------------------------------------------

Sprite.Red      = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-red-256x256.png
Sprite.Green    = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-green-256x256.png
Sprite.Blue     = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-blue-256x256.png
Sprite.Yellow   = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-yellow-256x256.png
Sprite.Selected = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-clear-256x256.png
Sprite.Shadow   = Demo/ParticleDemo/Resources/Images/Sprites/glass-sphere-shadow-256x256.png

#Sprite.Red      = Demo/ParticleDemo/Resources/Images/Sprites/light-red-250x250.png
#Sprite.Green    = Demo/ParticleDemo/Resources/Images/Sprites/light-green-250x250.png
#Sprite.Blue     = Demo/ParticleDemo/Resources/Images/Sprites/light-blue-250x250.png
